,\"text\":\"Tarteel AI is free to use. The paid subscription model - Tarteel Premium - adds other features such as Memorization Mistake Detection, memorization planning and the ability to review previous recordings and recitations.Subscribing also helps the Tarteel team to ensure continuous development and improvement of the program.\"}},{\"@type\":\"Question\",\"name\":\"What is Tarteel Premium?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Tarteel Premium is our subscription based model that allows users to unlock the full suite of AI tools to help them boost their Quran memorization.A Tarteel Premium subscription gives you access to our flagship feature, Memorization Mistake Detection, along with Memorization Journey Planning, Historical Mistakes, Peeking and so much more!You can view all Tarteel Premium features along with our pricing plans, here: https://tarteel.ai/pricing\"}},{\"@type\":\"Question\",\"name\":\"How can I subscribe to Tarteel Premium?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"There are a few different platforms where you can purchase the subscription from:From the Google Playstore if you have an Android phone or device.From the Apple Appstore if you have an iPhone or an iPadFrom the website by visiting the link here: https://tarteel.ai/pricingWe do have a monthly and an annual plan which you can choose from based on what is more convenient for you as well as Tarteel gift cards that you can purchase and redeem, that can be used for a fixed amount of time.For more information about the Premium features vs the free version, visit: https://tarteel.ai/pricing\"}},{\"@type\":\"Question\",\"name\":\"What’s Tarteel Alim?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Tarteel Alim is a program that was created by the Tarteel team to allow users who can't afford the Premium subscription price to access and enjoy the Premium AI features, wherever they are in the world.Similar to Quran Scholarships, the Alim program provides users with the ability to use Premium features such as Memorization Mistake Detection, creating an unlimited number of Goals, and unlocking the full analytics and insights tab to review the progress for their specific goals.To Apply to the Alim program, simply apply on the mobile app or via this link: Apply to Alim\"}},{\"@type\":\"Question\",\"name\":\"What’s the Tarteel Family Plan?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"The Family Plan is an exciting new way to memorize more together! The Family Plan allows up to 5 family members or friends to gain access to Tarteel Premium on a 1 subscription. The user who initiates the subscription will be the main account holder and will be billed annually. Over time, they can t"])</script><script>self.__next_f.push([1,"hen invite their loved ones and friends to join their Family Plan, giving everyone the opportunity to access their favorite Tarteel Premium features, including Memorization Mistake Detection, Memorization Journey Planning, Peeking and more!Find out more about the Family Plan subscription here: https://tarteel.ai/family\"}}]}]}6:[\"$\",\"$L25\",null,{\"namespaces\":[\"homepage\"],\"locale\":\"en\",\"data-sentry-element\":\"TranslationsProvider\",\"data-sentry-component\":\"WithTranslation\",\"data-sentry-source-file\":\"WithTranslation.tsx\",\"children\":[\"$\",\"div\",null,{\"dir\":\"ltr\",\"children\":[[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"$26\"}}],[\"$\",\"main\",null,{\"className\":\"overflow-hidden\",\"children\":[\"$\",\"$L2\",null,{\"parallelRouterKey\":\"children\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L3\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]}],\"$L27\"]}]}]\nc:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Tarteel AI Quran M
